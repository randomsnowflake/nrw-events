[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrw-events"
version = "0.1.0"
description = "Stdlib-only NRW event importer"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage~=7.9.2",
    "mypy~=1.17.0",
    "ruff~=0.12.3",
]

[project.scripts]
nrw-events = "nrw_events.runner:main"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["nrw_events*"]

[tool.setuptools.package-data]
nrw_events = [
    "categories.json",
    "junk_rules_data.json",
    "reviewed_corrections.json",
    "verified_venue_locations.json",
    "sources/radio_primary_sources.json",
    "sources/registry.json",
]

[tool.mypy]
python_version = "3.10"
files = [
    "scripts/nrw_events/core.py",
    "scripts/nrw_events/run_state.py",
    "scripts/nrw_events/http.py",
    "scripts/nrw_events/detail_cache.py",
    "scripts/nrw_events/text.py",
    "scripts/nrw_events/event_builder.py",
    "scripts/nrw_events/jsonld.py",
    "scripts/nrw_events/ical.py",
    "scripts/nrw_events/listing_parsers.py",
    "scripts/nrw_events/runtime.py",
    "scripts/nrw_events/import_contracts.py",
    "scripts/nrw_events/source_execution.py",
    "scripts/nrw_events/retention_policy.py",
    "scripts/nrw_events/identity_reconciliation.py",
    "scripts/nrw_events/snapshot_publication.py",
    "scripts/nrw_events/import_cli.py",
    "scripts/nrw_events/import_orchestration.py",
    "scripts/nrw_events/runner.py",
    "scripts/nrw_events/ai_enrichment.py",
    "scripts/nrw_events/report.py",
    "scripts/nrw_events/dedup_rules.py",
    "scripts/nrw_events/deduplication.py",
    "scripts/nrw_events/dedup_index.py",
    "scripts/nrw_events/dedup_merge.py",
    "scripts/nrw_events/duplicate_identity.py",
    "scripts/nrw_events/ranking.py",
    "scripts/nrw_events/markdown_report.py",

    "scripts/nrw_events/ai_cache.py",
    "scripts/nrw_events/ai_contracts.py",
    "scripts/nrw_events/ai_policy.py",
    "scripts/nrw_events/ai_settings.py",
    "scripts/nrw_events/ai_transport.py",
    "scripts/nrw_events/ai_orchestration.py",


    "scripts/nrw_events/dates.py",

    "scripts/nrw_events/normalization.py",
    "scripts/nrw_events/config.py",
    "scripts/nrw_events/health.py",
    "scripts/nrw_events/models.py",
    "scripts/nrw_events/identity.py",
    "scripts/nrw_events/reviewed_summaries.py",
    "scripts/nrw_events/reviewed_corrections.py",
    "scripts/nrw_events/location.py",
    "scripts/nrw_events/scoring.py",
    "scripts/nrw_events/observability.py",
    "scripts/nrw_events/performance.py",
    "scripts/nrw_events/components.py",
    "scripts/nrw_events/snapshot_compare.py",
    "scripts/nrw_events/benchmark.py",
    "scripts/nrw_events/title_normalization.py",
    "scripts/nrw_events/category_taxonomy.py",
    "scripts/nrw_events/junk_rules.py",
    "scripts/nrw_events/quality.py",
    "scripts/nrw_events/series.py",
    "scripts/nrw_events/radio_primary_resolution.py",
]
follow_imports = "skip"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["scripts/nrw_events"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "B", "UP", "SIM", "C4", "PERF", "RUF", "PLE", "PLW", "I"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "PLW0603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117", "RUF012"]
