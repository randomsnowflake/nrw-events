[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrw-events"
version = "0.1.0"
description = "Stdlib-only NRW event importer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage~=7.9.2",
    "mypy~=1.17.0",
    "pytest~=8.4.1",
    "ruff~=0.12.3",
]

[project.scripts]
nrw-events = "nrw_events.runner:main"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["nrw_events*"]

[tool.setuptools.package-data]
nrw_events = ["verified_venue_locations.json", "sources/registry.json"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
